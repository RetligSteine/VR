<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Lab-1</title>

    <style>
        body {
            background-color: #EEEEEE;
        }

        h1,
        h2 {
            text-align: center;
        }

        #controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
    </style>

    <script src="./Utils/trackball-rotator.js"></script>
    <script src="./Utils/m4.js"></script>
    <script src="./shader.gpu"></script>
    <script src="./Utils/RichmondsMinimalSurface.js"></script>
    <script src="./main.js"></script>
    <script src="./Utils/StereoCamera.js"></script>
    <script src="./Utils/Texture.js"></script>
</head>

<body onload="init()">
    <h1>Virtual reality, Lab-1</h1>
    <h1>RICHMOND'S MINIMAL SURFACE</h1>
    <h2>Sukhenko Bohdan, TR-41mp</h2>

    <div id="canvas-holder" align="center">
        <canvas width="800" height="500" id="webglcanvas" style="background-color:red"></canvas>
    </div>

    <div id="controls">
        <label for="eyeSeparation">Eye separation: <span id="eyeSeparationValue">0.2</span></label><br>
        <input type="range" id="eyeSeparation" min="0.01" max="2" step="0.01" value="0.2"><br>
    
        <label for="fov">Field of View (°): <span id="fovValue">25</span></label><br>
        <input type="range" id="fov" min="10" max="90" step="1" value="25"><br>
    
        <label for="nearClip">Near Clipping distance: <span id="nearClipValue">8</span></label><br>
        <input type="range" id="nearClip" min="1" max="20" step="0.1" value="8"><br>
    
        <label for="convergence">Convergence Distance: <span id="convergenceValue">14</span></label><br>
        <input type="range" id="convergence" min="1" max="25" step="0.1" value="14"><br>
    </div>



</body>

</html>
